services:
  db:
    image: mysql:8.4
    container_name: subtitle2-db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - '${MYSQL_DATA_DIR:-./docker-data/mysql}:/var/lib/mysql'
    networks:
      - subtitle2-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        HIGHLIGHT_AI_MODEL: ${HIGHLIGHT_AI_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    container_name: subtitle2-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      UPLOADS_DIR: /app/backend/uploads
      WHISPER_COMMAND: /opt/whisper/.venv/bin/whisper
      YTDLP_COMMAND: /opt/whisper/.venv/bin/yt-dlp
      HIGHLIGHT_AI_PYTHON_COMMAND: /opt/whisper/.venv/bin/python
      HIGHLIGHT_AI_SCRIPT_PATH: /app/backend/scripts/highlight-rerank.py
      FORCE_FREE_PORT_ON_START: "false"
      XDG_CACHE_HOME: /opt/whisper/cache
      PRELOADED_CACHE_DIR: /opt/whisper/preloaded-cache
      HF_HOME: /opt/whisper/cache/hf
      TRANSFORMERS_CACHE: /opt/whisper/cache/hf
      SENTENCE_TRANSFORMERS_HOME: /opt/whisper/cache/sentence-transformers
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - '${BACKEND_UPLOADS_DIR:-./docker-data/uploads}:/app/backend/uploads'
      - '${BACKEND_DATA_DIR:-./docker-data/data}:/app/backend/data'
      - '${WHISPER_CACHE_DIR:-./docker-data/whisper-cache}:/opt/whisper/cache'
    networks:
      - subtitle2-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: subtitle2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    networks:
      - subtitle2-net

networks:
  subtitle2-net:
    driver: bridge
